<!doctype html>
<!-- Birds-Eyes Instagram post designer. Render with: node brand/generator/render.js brand/generator/batch-NN.js -->
<html><head><meta charset="utf-8">
<style>
@font-face { font-family: BC; src: url(fonts/BarlowCondensed-Bold.ttf); font-weight: 700; }
@font-face { font-family: BC; src: url(fonts/BarlowCondensed-SemiBold.ttf); font-weight: 600; }
@font-face { font-family: B; src: url(fonts/Barlow-Medium.ttf); font-weight: 500; }
@font-face { font-family: B; src: url(fonts/Barlow-SemiBold.ttf); font-weight: 600; }
:root { --bush:#17321F; --bush2:#21432B; --ink:#13291C; --k:#F2C230; --paper:#F1F3EE; --paper2:#E5EADF; --pasture:#8FD16A; --ink2:#435047; }
* { margin:0; padding:0; box-sizing:border-box; }
body { background:#777; font-family:B; }
.post { width:1080px; height:1350px; position:relative; overflow:hidden; background:var(--bush); color:var(--paper); margin-bottom:20px; }
.bg { position:absolute; background-size:cover; background-position:center; }
.h { font:700 124px/.93 BC; letter-spacing:-.01em; }
.k { color:var(--k); }
.sub { font:500 38px/1.38 B; color:rgba(241,243,238,.9); }
.chip { display:inline-block; background:var(--k); color:var(--ink); font:700 44px/1 BC; padding:18px 28px 16px; border-radius:10px; }
.eyebrow { font:600 30px/1 B; letter-spacing:.14em; text-transform:uppercase; color:var(--pasture); }
.foot { position:absolute; left:72px; right:72px; bottom:0; height:166px; }
.foot .rule { position:absolute; left:0; right:0; top:0; height:2px; background:rgba(241,243,238,.25); }
.foot img { position:absolute; left:0; bottom:50px; width:230px; }
.foot .url { position:absolute; right:0; bottom:66px; font:600 34px/1 B; }
.light { background:var(--paper); color:var(--ink); }
.light .sub { color:var(--ink2); }
.light .h { color:var(--bush); }
.light .eyebrow { color:#2E6B3F; }
.light .foot .rule { background:rgba(19,41,28,.18); }
.light .foot .url { color:var(--bush); }
.list { list-style:none; }
.list li { display:flex; justify-content:space-between; align-items:baseline; gap:30px; padding:20px 0; border-top:2px solid rgba(241,243,238,.18); font:500 38px/1.2 B; }
.list b { font:700 52px/1 BC; color:var(--k); white-space:nowrap; }
.light .list li { border-color:rgba(19,41,28,.15); }
.light .list b { color:var(--bush); }
.steps { list-style:none; counter-reset:s; }
.steps li { counter-increment:s; position:relative; padding:0 0 34px 104px; }
.steps li::before { content:counter(s); position:absolute; left:0; top:-4px; width:72px; height:72px; border-radius:50%; background:var(--k); color:var(--ink); font:700 44px/72px BC; text-align:center; }
.steps b { display:block; font:700 52px/1 BC; }
.steps span { display:block; margin-top:8px; font:500 32px/1.35 B; color:rgba(241,243,238,.85); }
.ticks { list-style:none; }
.ticks li { position:relative; padding:14px 0 14px 60px; font:500 38px/1.3 B; }
.ticks li::before { content:""; position:absolute; left:4px; top:26px; width:30px; height:16px; border-left:6px solid var(--k); border-bottom:6px solid var(--k); transform:rotate(-45deg); }
.light .ticks li::before { border-color:#2E6B3F; }
.frame { position:absolute; background:#fff; padding:34px; box-shadow:0 30px 60px rgba(0,0,0,.35); }
.frame div { width:100%; height:100%; background-size:cover; background-position:center; }
.tag { position:absolute; background:var(--bush); color:var(--paper); font:600 30px/1 B; padding:14px 20px; border-radius:8px; }
</style></head>
<body>
<div id="out"></div>
<script>
const P = n => `../../assets/photos/${n}-2048.jpg`;
const FOOT = (light) => `<div class="foot"><div class="rule"></div><img src="../../assets/${light ? 'logo.svg' : 'logo-white.svg'}"><div class="url">birdseyes.co.nz</div></div>`;

// Layouts
const L = {
  // full photo, gradient, headline at bottom
  hero: o => `<div class="bg" style="inset:0;background-image:url(${P(o.photo)});background-position:${o.pos||'center'}"></div>
    <div class="bg" style="inset:0;background:linear-gradient(180deg,rgba(23,50,31,0) ${o.fadeFrom||28}%,rgba(23,50,31,.86) ${o.fadeMid||60}%,#17321F 80%)"></div>
    <div style="position:absolute;left:72px;right:72px;bottom:206px">
      ${o.eyebrow ? `<div class="eyebrow" style="margin-bottom:24px">${o.eyebrow}</div>` : ''}
      <div class="h">${o.h}</div>
      ${o.sub ? `<p class="sub" style="margin-top:26px;max-width:880px">${o.sub}</p>` : ''}
      ${o.chip ? `<span class="chip" style="margin-top:34px">${o.chip}</span>` : ''}
    </div>${FOOT()}`,
  // photo top, dark panel with list
  panel: o => `<div class="bg" style="left:0;right:0;top:0;height:${o.ph||660}px;background-image:url(${P(o.photo)});background-position:${o.pos||'center'}"></div>
    ${o.chip ? `<span class="chip" style="position:absolute;left:72px;top:${(o.ph||660)-104}px">${o.chip}</span>` : ''}
    <div style="position:absolute;left:72px;right:72px;top:${(o.ph||660)+60}px">
      <div class="h" style="font-size:${o.hs||104}px">${o.h}</div>
      ${o.sub ? `<p class="sub" style="margin-top:22px">${o.sub}</p>` : ''}
      ${o.list ? `<ul class="list" style="margin-top:30px">${o.list.map(([a,b])=>`<li><span>${a}</span><b>${b}</b></li>`).join('')}</ul>` : ''}
      ${o.ticks ? `<ul class="ticks" style="margin-top:20px">${o.ticks.map(t=>`<li>${t}</li>`).join('')}</ul>` : ''}
    </div>${FOOT()}`,
  // light: photo top with inset
  light: o => `<div class="bg" style="left:0;right:0;top:0;height:640px;background-image:url(${P(o.photo)});background-position:${o.pos||'center'}"></div>
    ${o.inset ? `<div class="bg" style="right:72px;top:440px;width:430px;height:300px;border:10px solid var(--paper);border-radius:14px;background-image:url(${P(o.inset)});background-position:${o.ipos||'center'};box-shadow:0 18px 40px rgba(0,0,0,.25)"></div>` : ''}
    ${o.tag ? `<div class="tag" style="left:72px;top:560px">${o.tag}</div>` : ''}
    <div style="position:absolute;left:72px;right:72px;top:${o.inset ? 790 : 720}px">
      <div class="h" style="font-size:${o.hs||112}px">${o.h}</div>
      ${o.sub ? `<p class="sub" style="margin-top:24px">${o.sub}</p>` : ''}
      ${o.ticks ? `<ul class="ticks" style="margin-top:20px">${o.ticks.map(t=>`<li>${t}</li>`).join('')}</ul>` : ''}
    </div>${FOOT(true)}`,
  // text-led card with a photo strip
  card: o => `<div style="position:absolute;left:72px;right:72px;top:96px">
      ${o.eyebrow ? `<div class="eyebrow" style="margin-bottom:28px">${o.eyebrow}</div>` : ''}
      <div class="h" style="font-size:${o.hs||124}px">${o.h}</div>
      ${o.sub ? `<p class="sub" style="margin-top:28px">${o.sub}</p>` : ''}
      ${o.steps ? `<ol class="steps" style="margin-top:56px">${o.steps.map(([a,b])=>`<li><b>${a}</b><span>${b}</span></li>`).join('')}</ol>` : ''}
      ${o.list ? `<ul class="list" style="margin-top:44px">${o.list.map(([a,b])=>`<li><span>${a}</span><b>${b}</b></li>`).join('')}</ul>` : ''}
      ${o.ticks ? `<ul class="ticks" style="margin-top:34px">${o.ticks.map(t=>`<li>${t}</li>`).join('')}</ul>` : ''}
    </div>
    ${o.strip ? `<div style="position:absolute;left:72px;right:72px;bottom:206px;height:${o.sh||260}px;display:grid;grid-template-columns:repeat(${o.strip.length},1fr);gap:14px">${o.strip.map(s=>`<div style="border-radius:10px;background:url(${P(s)}) center/cover"></div>`).join('')}</div>` : ''}
    ${FOOT()}`,
  // collage of 4
  grid: o => `<div style="position:absolute;left:0;right:0;top:0;height:760px;display:grid;grid-template-columns:1fr 1fr;grid-template-rows:1fr 1fr;gap:8px">${o.photos.map(s=>`<div style="background:url(${P(s)}) center/cover"></div>`).join('')}</div>
    <div style="position:absolute;left:72px;right:72px;top:820px">
      <div class="h" style="font-size:${o.hs||108}px">${o.h}</div>
      ${o.sub ? `<p class="sub" style="margin-top:22px">${o.sub}</p>` : ''}
    </div>${FOOT()}`,
  // framed print on a wall
  print: o => `<div class="bg" style="inset:0;background:linear-gradient(180deg,#E9E4DA 0%,#DCD5C8 62%,#C9BFAF 62%,#BFB3A1 100%)"></div>
    <div class="frame" style="left:150px;right:150px;top:110px;height:560px;border:18px solid #2a2a26"><div style="background-image:url(${P(o.photo)})"></div></div>
    <div class="bg" style="left:0;right:0;top:760px;bottom:0;background:var(--bush)"></div>
    <div style="position:absolute;left:72px;right:72px;top:820px">
      ${o.eyebrow ? `<div class="eyebrow" style="margin-bottom:22px">${o.eyebrow}</div>` : ''}
      <div class="h" style="font-size:${o.hs||100}px">${o.h}</div>
      ${o.sub ? `<p class="sub" style="margin-top:20px">${o.sub}</p>` : ''}
    </div>${FOOT()}`
};

window.renderAds = function (ADS) {
  document.getElementById('out').innerHTML = ADS.map(o => `<section class="post ${o.t==='light'?'light':''}" id="${o.id}">${L[o.t](o)}</section>`).join('');
  return ADS.map(o => o.id);
};

</script>
</body></html>
